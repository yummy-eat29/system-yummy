name: Build System Yummy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          mkdir -p project/www

          rsync -av \
            --exclude='.git' \
            --exclude='project' \
            --exclude='.github' \
            ./ project/www/

          cat > project/package.json <<'EOF'
          {
            "name": "system-yummy-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

          cat > project/capacitor.config.json <<'EOF'
          {
            "appId": "com.systemyummy.app",
            "appName": "System Yummy",
            "webDir": "www",
            "android": {
              "scheme": "https"
            }
          }
          EOF

          cd project

          npm install

          npx cap add android

          mkdir -p android/app/src/main/java/com/systemyummy/app

          cat > android/app/src/main/java/com/systemyummy/app/PrinterBridge.kt <<'EOF'
          package com.systemyummy.app

          import android.Manifest
          import android.app.Activity
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothSocket
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import java.util.UUID

          class PrinterBridge(private val activity: Activity) {

              private var socket: BluetoothSocket? = null

              private val sppUuid =
                  UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              private fun hasBluetoothPermission(): Boolean {
                  return Build.VERSION.SDK_INT < 31 ||
                      activity.checkSelfPermission(
                          Manifest.permission.BLUETOOTH_CONNECT
                      ) == PackageManager
