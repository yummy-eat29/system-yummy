name: Build System Yummy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Android APK
        shell: bash
        run: |
          set -e
          mkdir -p project/www
          cp -R . project/www/
          cat > project/package.json <<'JSON'
          {"name":"system-yummy-android","private":true,"dependencies":{"@capacitor/core":"7.4.3","@capacitor/android":"7.4.3"},"devDependencies":{"@capacitor/cli":"7.4.3"}}
          JSON
          cat > project/capacitor.config.json <<'JSON'
          {"appId":"com.systemyummy.app","appName":"System Yummy","webDir":"www","android":{"scheme":"https"}}
          JSON
          cd project
          npm install
          npx cap add android
          mkdir -p android/app/src/main/java/com/systemyummy/app
          cat > android/app/src/main/java/com/systemyummy/app/PrinterBridge.kt <<'KOTLIN'
          package com.systemyummy.app
          import android.Manifest
          import android.app.Activity
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothSocket
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import java.io.IOException
          import java.util.UUID

          class PrinterBridge(private val activity: Activity) {
              private var socket: BluetoothSocket? = null
              private val sppUuid = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")
              private fun hasPermission() = Build.VERSION.SDK_INT < 31 || activity.checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED
              private fun requestPermission() { if (Build.VERSION.SDK_INT >= 31) activity.requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.BLUETOOTH_CONNECT), 701) }
              @JavascriptInterface fun isSupported() = BluetoothAdapter.getDefaultAdapter() != null
              @JavascriptInterface fun isConnected() = try { socket?.isConnected == true } catch (_: Exception) { false }
              @JavascriptInterface fun getConnectedName() = try { socket?.remoteDevice?.name ?: "" } catch (_: Exception) { "" }
              @JavascriptInterface fun openBluetoothSettings() { activity.startActivity(Intent(android.provider.Settings.ACTION_BLUETOOTH_SETTINGS)) }
              @JavascriptInterface fun connect(namePrefix: String): Boolean {
                  if (!hasPermission()) { requestPermission(); return false }
                  val adapter = BluetoothAdapter.getDefaultAdapter() ?: return false
                  if (!adapter.isEnabled) return false
                  disconnect()
                  val wanted = namePrefix.trim().lowercase()
                  val device = try { adapter.bondedDevices.firstOrNull { d -> val n=(d.name ?: "").lowercase(); wanted.isEmpty() || n.contains(wanted) || n.contains("617-r58p") } } catch (_: SecurityException) { null } ?: return false
                  return try { adapter.cancelDiscovery(); val s=device.createRfcommSocketToServiceRecord(sppUuid); s.connect(); socket=s; true } catch (_: Exception) { disconnect(); false }
              }
              @JavascriptInterface fun writeBase64(data: String): Boolean = try { if (!hasPermission()) return false; val bytes=Base64.decode(data, Base64.DEFAULT); socket?.outputStream?.write(bytes); socket?.outputStream?.flush(); true } catch (_: Exception) { false }
              @JavascriptInterface fun disconnect() { try { socket?.close() } catch (_: Exception) {}; socket=null }
          }
          KOTLIN
          cat > android/app/src/main/java/com/systemyummy/app/MainActivity.kt <<'KOTLIN'
          package com.systemyummy.app
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private lateinit var printer: PrinterBridge
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView=WebView(this)
                  webView.settings.javaScriptEnabled=true
                  webView.settings.domStorageEnabled=true
                  webView.settings.allowFileAccess=true
                  webView.settings.cacheMode=WebSettings.LOAD_DEFAULT
                  webView.webViewClient=WebViewClient()
                  webView.webChromeClient=WebChromeClient()
                  printer=PrinterBridge(this)
                  webView.addJavascriptInterface(printer,"AndroidPrinter")
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/public/index.html")
              }
              override fun onDestroy() { printer.disconnect(); webView.destroy(); super.onDestroy() }
          }
          KOTLIN
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          perms='''\n<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n<uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n'''
          if 'android.permission.BLUETOOTH_CONNECT' not in s: s=s.replace('<manifest','<manifest'+perms,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          npx cap sync android
          ./android/gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: system-yummy-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
